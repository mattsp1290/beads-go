name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify module graph
        run: go mod tidy --diff

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: golangci-lint run ./...

      - name: Check formatting
        run: golangci-lint fmt --diff

      - name: Test with race detector
        run: go test -race ./...

  integration:
    name: integration
    runs-on: ubuntu-latest
    env:
      BD_NPM_PACKAGE: "@beads/bd@1.0.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true

      - name: Install pinned bd
        run: npm install -g "$BD_NPM_PACKAGE"

      - name: Verify bd version
        run: bd --version

      - name: Run integration tests
        run: go test -tags=integration ./...
